version: "2"
linters:
    default: standard
    enable:
        - errorlint
        - gocritic
        - misspell
        - revive
        - unconvert
        - unparam
formatters:
    enable:
        - gofmt
        - goimports
    settings:
        goimports:
            local-prefixes:
                - example.com/mymodule
